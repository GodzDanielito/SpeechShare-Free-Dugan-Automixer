name: Feature request
description: Propose an improvement to the DSP, routing, performance, or UI
labels: [enhancement]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [Modular 4, Insert VST3, Both]
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: Include relevant routing/latency/audio constraints.
